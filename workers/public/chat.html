<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habla con Luanna — chat web</title>
  <meta name="description" content="Prueba a Luanna, tu agente de viajes, directamente desde el navegador. Misma experiencia que en WhatsApp.">
  <link rel="canonical" href="https://luanna.app/chat">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#ff385c">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://luanna.app/chat">
  <meta property="og:title" content="Habla con Luanna — chat web">
  <meta property="og:description" content="Prueba a Luanna, tu agente de viajes, directamente desde el navegador.">
  <meta property="og:image" content="https://luanna.app/og-image.svg">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="Luanna">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Habla con Luanna — chat web">
  <meta name="twitter:description" content="Prueba a Luanna, tu agente de viajes, directamente desde el navegador.">
  <meta name="twitter:image" content="https://luanna.app/og-image.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rausch: #ff385c;
      --rausch-dark: #e00b41;
      --text: #222222;
      --text-2: #6a6a6a;
      --text-3: #929292;
      --bg: #ffffff;
      --surface: #fafafa;
      --surface-2: #f2f2f2;
      --border: rgba(0, 0, 0, 0.08);
      --shadow-card: rgba(0, 0, 0, 0.02) 0px 0px 0px 1px,
                     rgba(0, 0, 0, 0.04) 0px 2px 6px,
                     rgba(0, 0, 0, 0.10) 0px 4px 8px;
      --shadow-hover: rgba(0, 0, 0, 0.08) 0px 4px 12px;
      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont,
              "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font);
      font-weight: 500;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; }

    /* ─── Header ─── */
    header {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      max-width: 880px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--rausch);
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: baseline;
      gap: 2px;
    }
    .logo span { color: var(--text); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: rgba(255, 56, 92, 0.08);
      color: var(--rausch);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rausch);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
    }
    .reset-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .reset-btn:hover {
      color: var(--rausch);
      border-color: var(--rausch);
      transform: translateY(-1px);
    }

    /* ─── Chat container ─── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 16px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.12);
      border-radius: 3px;
    }
    .messages::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
    }

    /* ─── Welcome state ─── */
    .welcome {
      max-width: 640px;
      margin: 32px auto;
      text-align: center;
      animation: fadeUp 0.6s ease-out;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .welcome-illustration {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .welcome h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.6px;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .welcome h1 .accent { color: var(--rausch); }
    .welcome p {
      font-size: 16px;
      color: var(--text-2);
      max-width: 480px;
      margin: 0 auto 28px;
    }
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.18s ease;
      animation: fadeUp 0.6s ease-out backwards;
    }
    .chip:nth-child(1) { animation-delay: 0.15s; }
    .chip:nth-child(2) { animation-delay: 0.25s; }
    .chip:nth-child(3) { animation-delay: 0.35s; }
    .chip:nth-child(4) { animation-delay: 0.45s; }
    .chip:hover {
      border-color: var(--rausch);
      color: var(--rausch);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    .chip svg { width: 14px; height: 14px; }

    /* ─── Messages ─── */
    .msg-row {
      display: flex;
      margin-bottom: 14px;
      animation: msgIn 0.32s cubic-bezier(0.2, 0.8, 0.3, 1);
    }
    @keyframes msgIn {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; gap: 10px; align-items: flex-end; }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--rausch);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(255, 56, 92, 0.25);
    }
    .msg {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 22px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg-row.user .msg {
      background: var(--text);
      color: #fff;
      border-bottom-right-radius: 6px;
    }
    .msg-row.ai .msg {
      background: #fff;
      color: var(--text);
      border-bottom-left-radius: 6px;
      box-shadow: var(--shadow-card);
    }
    .msg a {
      color: var(--rausch);
      text-decoration: underline;
      word-break: break-all;
      font-weight: 600;
    }
    .msg-row.user .msg a {
      color: #fff;
      text-decoration: underline;
    }
    .msg strong { font-weight: 700; }
    .msg em { font-style: italic; }

    /* ─── Typing indicator ─── */
    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 14px 18px;
      background: #fff;
      border-radius: 22px;
      border-bottom-left-radius: 6px;
      box-shadow: var(--shadow-card);
    }
    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-3);
      animation: typingBounce 1.2s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ─── Input bar ─── */
    .input-bar {
      flex-shrink: 0;
      padding: 12px 0 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, var(--bg) 24%);
    }
    .input-wrap {
      position: relative;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 6px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .input-wrap:focus-within {
      border-color: var(--rausch);
      box-shadow: 0 0 0 3px rgba(255, 56, 92, 0.12);
    }
    textarea#input {
      flex: 1;
      min-height: 44px;
      max-height: 160px;
      padding: 12px 14px;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      background: transparent;
      line-height: 1.4;
    }
    textarea#input::placeholder { color: var(--text-3); }
    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--rausch);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.18s ease;
    }
    .send-btn:hover:not(:disabled) {
      background: var(--rausch-dark);
      transform: scale(1.08);
    }
    .send-btn:active:not(:disabled) { transform: scale(0.94); }
    .send-btn:disabled {
      background: var(--surface-2);
      color: var(--text-3);
      cursor: not-allowed;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      color: var(--text-2);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s, transform 0.15s;
    }
    .icon-btn:hover:not(:disabled) {
      background: var(--surface-2);
      color: var(--text);
    }
    .icon-btn:active:not(:disabled) { transform: scale(0.94); }
    .icon-btn:disabled { color: var(--text-3); cursor: not-allowed; }
    .icon-btn.recording {
      background: rgba(255, 56, 92, 0.12);
      color: var(--rausch);
      animation: micPulse 1.4s ease-in-out infinite;
    }
    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 56, 92, 0.35); }
      50% { box-shadow: 0 0 0 8px rgba(255, 56, 92, 0); }
    }
    .rec-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 56, 92, 0.10);
      color: var(--rausch);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .rec-pill .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--rausch);
      animation: micPulse 1.4s ease-in-out infinite;
    }
    .msg img.msg-image {
      max-width: 240px;
      max-height: 240px;
      border-radius: 12px;
      display: block;
    }
    .input-hint {
      font-size: 11px;
      color: var(--text-3);
      text-align: center;
      margin-top: 8px;
    }
    .input-hint a { color: var(--rausch); text-decoration: none; font-weight: 600; }
    .input-hint a:hover { text-decoration: underline; }

    /* ─── Responsive ─── */
    @media (max-width: 540px) {
      .nav { padding: 0 16px; height: 56px; }
      .logo { font-size: 20px; }
      .badge { font-size: 10px; padding: 4px 8px; }
      main { padding: 0 16px; }
      .welcome h1 { font-size: 26px; }
      .welcome p { font-size: 15px; }
      .welcome-illustration { width: 96px; height: 96px; margin-bottom: 16px; }
      .msg { font-size: 14px; max-width: 84%; }
      .reset-btn span { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav">
      <a href="/" class="logo">luanna<span>.</span></a>
      <div class="badge">
        <span class="badge-dot"></span>
        Modo prueba
      </div>
      <button class="reset-btn" id="reset-btn" title="Reiniciar conversación">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
        <span>Reiniciar</span>
      </button>
    </div>
  </header>

  <main>
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-illustration" aria-hidden="true">
          <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="luaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff385c"/>
                <stop offset="100%" stop-color="#e00b41"/>
              </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="52" fill="url(#luaGradient)" opacity="0.10"/>
            <circle cx="60" cy="60" r="36" fill="url(#luaGradient)" opacity="0.18"/>
            <circle cx="60" cy="60" r="22" fill="url(#luaGradient)"/>
            <path d="M50 56 L60 50 L70 56 L70 68 L62 68 L62 62 L58 62 L58 68 L50 68 Z" fill="#fff" opacity="0.95"/>
            <circle cx="92" cy="32" r="3" fill="#ff385c">
              <animate attributeName="cy" values="32;28;32" dur="2.5s" repeatCount="indefinite"/>
            </circle>
            <circle cx="28" cy="92" r="2.5" fill="#ff385c" opacity="0.6">
              <animate attributeName="cx" values="28;32;28" dur="3s" repeatCount="indefinite"/>
            </circle>
            <circle cx="100" cy="78" r="2" fill="#ff385c" opacity="0.5">
              <animate attributeName="cy" values="78;82;78" dur="3.5s" repeatCount="indefinite"/>
            </circle>
          </svg>
        </div>
        <h1>Hola, soy <span class="accent">Luanna</span> 👋</h1>
        <p>Tu agente de viajes en WhatsApp — y ahora también acá. Pregúntame por vuelos, hoteles o paquetes y te paso links reales para comparar.</p>
        <div class="quick-chips">
          <button class="chip" data-prompt="Vuelos baratos de Lima a Madrid en agosto 2026">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
            Vuelos LIM → MAD
          </button>
          <button class="chip" data-prompt="Hoteles en Madrid del 15 al 20 de agosto 2026 para 2 personas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4v16M22 4v16M2 8h20M2 16h20M6 12h12"/></svg>
            Hoteles en Madrid
          </button>
          <button class="chip" data-prompt="Quiero un paquete vuelo+hotel Lima a Cancún del 10 al 17 de agosto 2026, 2 adultos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 16h5v5M19 12V3M3 21l8-8 5 5"/><path d="M3 13V3h10"/></svg>
            Paquete LIM → CUN
          </button>
          <button class="chip" data-prompt="Avísame si bajan vuelos a Buenos Aires de menos de $400">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Crear alerta
          </button>
        </div>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-wrap">
        <input type="file" id="image-input" accept="image/*" hidden>
        <button class="icon-btn" id="attach-btn" type="button" aria-label="Adjuntar foto" title="Adjuntar foto">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <span class="rec-pill" id="rec-pill" style="display:none">
          <span class="rec-dot"></span>
          <span id="rec-timer">0:00</span>
        </span>
        <textarea
          id="input"
          placeholder="Escríbele a Luanna..."
          rows="1"
          autocomplete="off"
        ></textarea>
        <button class="icon-btn" id="mic-btn" type="button" aria-label="Grabar nota de voz" title="Grabar nota de voz">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button class="send-btn" id="send-btn" aria-label="Enviar mensaje">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">
        Esta es la versión web. Para la real, escríbele en <a href="https://wa.me/message/4RGE5PFNLMZSM1" target="_blank" rel="noopener">WhatsApp</a>.
      </p>
    </div>
  </main>

  <script>
    (function () {
      const messages = document.getElementById('messages');
      const welcome = document.getElementById('welcome');
      const input = document.getElementById('input');
      const sendBtn = document.getElementById('send-btn');
      const resetBtn = document.getElementById('reset-btn');
      let busy = false;

      function getOrCreateSession() {
        let s = localStorage.getItem('luanna_session_id');
        if (!s) {
          s = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2)))
            .replace(/[^a-zA-Z0-9_-]/g, '');
          localStorage.setItem('luanna_session_id', s);
        }
        return s;
      }

      function readRefCode() {
        try {
          const fromUrl = new URLSearchParams(location.search).get('ref');
          if (fromUrl && /^[A-Za-z0-9]{4,20}$/.test(fromUrl)) {
            sessionStorage.setItem('luanna_ref', fromUrl);
            return fromUrl;
          }
          return sessionStorage.getItem('luanna_ref');
        } catch (e) { return null; }
      }
      // Only fire ref on the first message after page load
      let pendingRef = readRefCode();

      function escapeHtml(s) {
        return s
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderText(text) {
        const escaped = escapeHtml(text);
        // links: http(s)://...
        const linked = escaped.replace(
          /(https?:\/\/[^\s)]+)/g,
          (m) => `<a href="${m}" target="_blank" rel="noopener">${m}</a>`
        );
        // bold **text**
        return linked.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      }

      function appendMessage(role, text) {
        if (welcome && welcome.parentNode) welcome.remove();
        const row = document.createElement('div');
        row.className = 'msg-row ' + role;
        if (role === 'ai') {
          const avatar = document.createElement('div');
          avatar.className = 'msg-avatar';
          avatar.textContent = 'L';
          row.appendChild(avatar);
        }
        const bubble = document.createElement('div');
        bubble.className = 'msg';
        bubble.innerHTML = renderText(text);
        row.appendChild(bubble);
        messages.appendChild(row);
        scrollToBottom();
        return row;
      }

      function appendTyping() {
        const row = document.createElement('div');
        row.className = 'msg-row ai';
        row.id = 'typing-row';
        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.textContent = 'L';
        row.appendChild(avatar);
        const t = document.createElement('div');
        t.className = 'typing';
        t.innerHTML = '<span></span><span></span><span></span>';
        row.appendChild(t);
        messages.appendChild(row);
        scrollToBottom();
      }

      function removeTyping() {
        const t = document.getElementById('typing-row');
        if (t) t.remove();
      }

      function scrollToBottom() {
        requestAnimationFrame(() => {
          messages.scrollTop = messages.scrollHeight;
        });
      }

      function autoresize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
      }

      function appendImageBubble(role, dataUrl, caption) {
        if (welcome && welcome.parentNode) welcome.remove();
        const row = document.createElement('div');
        row.className = 'msg-row ' + role;
        if (role === 'ai') {
          const avatar = document.createElement('div');
          avatar.className = 'msg-avatar';
          avatar.textContent = 'L';
          row.appendChild(avatar);
        }
        const bubble = document.createElement('div');
        bubble.className = 'msg';
        const img = document.createElement('img');
        img.className = 'msg-image';
        img.src = dataUrl;
        bubble.appendChild(img);
        if (caption && caption.trim()) {
          const cap = document.createElement('div');
          cap.style.marginTop = '6px';
          cap.innerHTML = renderText(caption);
          bubble.appendChild(cap);
        }
        row.appendChild(bubble);
        messages.appendChild(row);
        scrollToBottom();
      }

      async function send(opts) {
        // opts can be a string (text only) or { text, image, audio }
        if (typeof opts === 'string') opts = { text: opts };
        const text = (opts.text || '').trim();
        const image = opts.image || null;
        const audio = opts.audio || null;
        if (busy) return;
        if (!text && !image && !audio) return;
        busy = true;
        sendBtn.disabled = true;
        attachBtn.disabled = true;
        micBtn.disabled = true;

        if (image) {
          const url = URL.createObjectURL(image);
          appendImageBubble('user', url, text);
        } else if (audio) {
          appendMessage('user', '🎤 Nota de voz enviada…');
        } else {
          appendMessage('user', text);
        }
        input.value = '';
        autoresize();
        appendTyping();

        try {
          const session_id = getOrCreateSession();
          let res;
          if (image || audio) {
            const form = new FormData();
            form.append('session_id', session_id);
            if (text) form.append('message', text);
            if (image) form.append('image', image, image.name || 'photo.jpg');
            if (audio) form.append('audio', audio, 'voice.webm');
            if (pendingRef) {
              form.append('ref', pendingRef);
              pendingRef = null;
              try { sessionStorage.removeItem('luanna_ref'); } catch (e) {}
            }
            res = await fetch('/api/chat', { method: 'POST', body: form });
          } else {
            const payload = { message: text, session_id };
            if (pendingRef) {
              payload.ref = pendingRef;
              pendingRef = null;
              try { sessionStorage.removeItem('luanna_ref'); } catch (e) {}
            }
            res = await fetch('/api/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
          }
          const data = await res.json().catch(() => null);
          removeTyping();
          if (!res.ok || !data) {
            const status = res.status;
            let msg = '⚠️ Hubo un problema procesando tu mensaje. Inténtalo de nuevo.';
            if (status === 413) msg = '⚠️ El archivo es muy grande. Prueba con una foto/audio más liviano.';
            else if (status === 429) msg = '⚠️ Demasiados mensajes seguidos. Espera unos segundos.';
            appendMessage('ai', msg);
          } else if (data.error) {
            appendMessage('ai', '⚠️ ' + data.error);
          } else if (data.reply && data.reply.trim()) {
            appendMessage('ai', data.reply.trim());
          } else {
            appendMessage('ai', '...');
          }
        } catch (err) {
          removeTyping();
          appendMessage('ai', '⚠️ Error de red. Verifica tu conexión.');
        } finally {
          busy = false;
          sendBtn.disabled = false;
          attachBtn.disabled = false;
          micBtn.disabled = false;
          input.focus();
        }
      }

      const attachBtn = document.getElementById('attach-btn');
      const micBtn = document.getElementById('mic-btn');
      const imageInput = document.getElementById('image-input');
      const recPill = document.getElementById('rec-pill');
      const recTimer = document.getElementById('rec-timer');
      let mediaRecorder = null;
      let recordedChunks = [];
      let recordStartedAt = 0;
      let recordTimerId = null;

      input.addEventListener('input', autoresize);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send(input.value);
        }
      });
      sendBtn.addEventListener('click', () => send(input.value));

      attachBtn.addEventListener('click', () => imageInput.click());
      imageInput.addEventListener('change', () => {
        const file = imageInput.files && imageInput.files[0];
        imageInput.value = '';
        if (!file) return;
        if (file.size > 6 * 1024 * 1024) {
          appendMessage('ai', '⚠️ La foto es muy grande (máx 6 MB).');
          return;
        }
        send({ text: input.value, image: file });
      });

      function formatRecTime(ms) {
        const s = Math.floor(ms / 1000);
        return Math.floor(s / 60) + ':' + (s % 60).toString().padStart(2, '0');
      }
      function stopRecording(cancel) {
        if (!mediaRecorder) return;
        const wasRecording = mediaRecorder.state === 'recording';
        try { if (wasRecording) mediaRecorder.stop(); } catch (e) {}
        if (recordTimerId) clearInterval(recordTimerId);
        recordTimerId = null;
        recPill.style.display = 'none';
        micBtn.classList.remove('recording');
        micBtn.title = 'Grabar nota de voz';
        if (cancel) { recordedChunks = []; mediaRecorder = null; }
      }
      async function startRecording() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          appendMessage('ai', '⚠️ Tu navegador no soporta grabación de audio.');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? 'audio/webm;codecs=opus'
            : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
          mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
          recordedChunks = [];
          mediaRecorder.addEventListener('dataavailable', (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
          });
          mediaRecorder.addEventListener('stop', () => {
            stream.getTracks().forEach((t) => t.stop());
            if (recordedChunks.length === 0) return;
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            if (blob.size < 1000) {
              appendMessage('ai', '⚠️ La grabación fue muy corta. Intenta otra vez.');
              return;
            }
            if (blob.size > 8 * 1024 * 1024) {
              appendMessage('ai', '⚠️ El audio es muy largo (máx ~8 MB).');
              return;
            }
            send({ audio: blob });
          });
          mediaRecorder.start();
          recordStartedAt = Date.now();
          recPill.style.display = 'inline-flex';
          recTimer.textContent = '0:00';
          micBtn.classList.add('recording');
          micBtn.title = 'Detener y enviar';
          recordTimerId = setInterval(() => {
            const elapsed = Date.now() - recordStartedAt;
            recTimer.textContent = formatRecTime(elapsed);
            // Hard cap at 90s
            if (elapsed >= 90 * 1000) stopRecording(false);
          }, 300);
        } catch (err) {
          appendMessage('ai', '⚠️ No pude acceder al micrófono. Revisa los permisos del navegador.');
        }
      }
      micBtn.addEventListener('click', () => {
        if (busy) return;
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          stopRecording(false);
        } else {
          startRecording();
        }
      });

      document.querySelectorAll('.chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
          send(chip.dataset.prompt);
        });
      });

      resetBtn.addEventListener('click', async function () {
        if (!confirm('¿Reiniciar la conversación? Se borrará todo el historial.')) return;
        const session_id = getOrCreateSession();
        try {
          await fetch('/api/chat/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id }),
          });
        } catch (e) { /* noop */ }
        localStorage.removeItem('luanna_session_id');
        location.reload();
      });

      // Auto-focus input on desktop
      if (window.matchMedia('(min-width: 768px)').matches) {
        input.focus();
      }
      getOrCreateSession();
    })();
  </script>

</body>
