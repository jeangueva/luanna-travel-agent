name = "luanna-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain bindings (luanna.app zone in this Cloudflare account).
routes = [
  { pattern = "luanna.app", custom_domain = true },
  { pattern = "www.luanna.app", custom_domain = true }
]

[vars]
PUBLIC_BASE_URL = "https://luanna.app"
# Bot's WhatsApp number in E.164 WITHOUT the leading + (e.g. "51977150415").
# Used to build wa.me link-merge URLs from /chat → WhatsApp. Leave empty to
# disable the "Vincular con WhatsApp" feature.
LUANNA_WHATSAPP_NUMBER = "12024908102"

# ── LLM provider ───────────────────────────────────────────────────────────
# "anthropic" (default, Claude), "minimax", "gemini", or "deepseek". Flip +
# deploy to route the bot through a different model — no code change. Each
# non-default provider needs its own API key secret (MINIMAX_API_KEY /
# GEMINI_API_KEY / DEEPSEEK_API_KEY). Roll back instantly: set back to
# "anthropic" + deploy. Whichever is primary, the stale-result backstop
# (forcedSearchRetry in src/index.ts) always corrects on Claude — so a
# provider that skips tool calls under load degrades gracefully instead of
# losing the link, at the cost of that provider's own quirks otherwise.
LLM_PROVIDER = "minimax"
MINIMAX_BASE_URL = "https://api.minimax.io/anthropic/v1"
# Benchmarked 2026-07-15 (same prompt, 5 runs each, end-to-end via /api/chat):
# M3 median 4.9s vs M2.5-highspeed median 6.9s — M2.5's higher t/s loses to
# the extra tokens it generates per reply. Keep M3; re-benchmark before any
# swap instead of trusting provider throughput numbers.
MINIMAX_MODEL = "MiniMax-M3"
# GEMINI_MODEL default: "gemini-2.5-flash". DEEPSEEK_MODEL default: "deepseek-chat".
# Neither has been prod-benchmarked yet on Luanna's actual tool-calling flow —
# re-run the same 5-prompt benchmark as MiniMax before trusting published
# throughput/pricing numbers for this specific search_flights/hotels/stays
# workload.

# ── Hotels ─────────────────────────────────────────────────────────────────
# "amadeus" (real offers via Amadeus Self-Service) or default (Hotellook cache,
# which needs the Travelpayouts Hotels Data API approval). Amadeus also needs
# the AMADEUS_CLIENT_ID + AMADEUS_CLIENT_SECRET secrets. Booking links stay the
# TP affiliate URL either way. Test host until you have production Amadeus creds.
HOTELS_PROVIDER = "hotellook"
AMADEUS_BASE_URL = "https://test.api.amadeus.com"

# ── Stays (Airbnb + Booking) ────────────────────────────────────────────────
# "scrape" routes the search_stays tool to the external Python scraping service
# (services/stays: Airbnb + Booking.com), used while the TP Hotels Data API is
# gated (needs 50k MAU). "airbnb" is a legacy alias for "scrape". Needs
# STAYS_SERVICE_URL + STAYS_API_KEY secrets. "off" (default) → the tool still
# works, returning the TP vacation-rental search link (monetizes).
STAYS_PROVIDER = "off"

[assets]
directory = "./public"
binding = "ASSETS"
# Worker runs first so it can redirect www→apex before assets are served.
# Worker must explicitly delegate to env.ASSETS.fetch(request) for static files.
run_worker_first = true

# Workers AI binding (free tier covers Whisper for voice-note transcription;
# 10k neurons/day, Whisper costs ~150 neurons per minute of audio).
[ai]
binding = "AI"

# Browser Rendering (headless Chromium) — renders the trip itinerary HTML to
# PDF server-side via @cloudflare/puppeteer. Requires Workers Paid. The binding
# IS the enablement; no dashboard toggle needed.
[browser]
binding = "BROWSER"

[triggers]
crons = [
  "0 */6 * * *",      # watchlist checks every 6h
  "0 14 * * *",       # daily offer push at 9am Lima (14:00 UTC)
  "0 3 * * *",        # cleanup rate_limits + processed_webhooks at 3am UTC
  "0 * * * *",        # error-alert digest every hour (no-op when ALERT_WEBHOOK_URL unset)
  "0 15 * * *"        # staggered re-engagement + seasonal nudges (daily, 10am Lima)
]

# Secrets (set via `wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY      — key de console.anthropic.com (no el Claude Pro de claude.ai)
#   KAPSO_WEBHOOK_SECRET   — para verificar firma del webhook
#   KAPSO_API_KEY          — para enviar mensajes a Kapso
#   LUANNA_MODEL           — modelo de Anthropic (default: claude-haiku-4-5)
#   DATABASE_URL           — Postgres (Neon) connection string
#   TRAVELPAYOUTS_TOKEN    — API token de Travelpayouts
#   TRAVELPAYOUTS_MARKER   — affiliate marker para links de Travelpayouts
#   WEBVIEW_SIGNING_KEY    — HMAC key para tokens del webview (fallback)
#   KAPSO_PREFS_FLOW_ID    — meta_flow_id del Flow de preferencias
#   KAPSO_PREFS_FLOW_DRAFT — "1" para enviar el Flow en modo draft (preview, sin publicar)
#   ADMIN_API_KEY          — bearer token para /admin/data-deletion/* (32+ chars)
#   ALERT_WEBHOOK_URL      — opcional. Slack/Discord/genérico. POST { text, content }.
#                            Setear con `wrangler secret put ALERT_WEBHOOK_URL`.
#   POSTHOG_API_KEY        — opcional. PROJECT_API_KEY de app.posthog.com.
#                            Sin setear, los track() son no-ops silenciosos.
#   POSTHOG_HOST           — opcional. Override del host (default us.i.posthog.com).
#                            Usar https://eu.i.posthog.com si elegiste data center EU.

# Para desarrollo local, usar workers/.dev.vars (git-ignored)
